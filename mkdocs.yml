site_name: CareRobotics
site_description: Task allocation and fleet orchestration for hospital restocking robots
repo_url: https://github.com/nikhilr2907/CareBot-Planning
repo_name: CareBot-Planning

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Environments: environments.md
  - Core interface: core-interface.md
  - ROS bridge: ros-bridge.md
  - Policy and training: policy-and-training.md
  - Reliability: reliability.md

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["archive", "utilities", "tools", "digital_twin", "site"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["src", "scripts", "run_training.py", "run_training_real.py", "run_deployment.py", "run_real_deployment.py"]
check_untyped_defs = true
follow_imports = "silent"
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["torch.*", "torch_geometric.*", "pygame.*", "matplotlib.*", "pandas.*", "plotly.*", "seaborn.*", "scipy.*", "sklearn.*", "websockets.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.exceptions", "src.environment.robot.robot_telemetry", "src.environment.tasks.task_state", "src.environment.graph.edge", "src.analytics.metrics.helpers", "scripts.check_conventions"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

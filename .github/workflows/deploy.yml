name: Deploy to GPU cluster

on:
  push:
    branches: [ "main" ]

# Required repository configuration (Settings → Secrets and variables → Actions):
#   secrets.SSH_KEY            private key with access to the cluster
#   vars.CLUSTER_JUMP_HOST     login/jump host, e.g. login.example.ac.uk
#   vars.CLUSTER_GPU_HOST      GPU node reached through the jump host
#   vars.CLUSTER_USER          username on the cluster
#   vars.CLUSTER_REMOTE_DIR    absolute path on the cluster to sync into
#   vars.RUN_SBATCH            set to "true" to also submit shell/train.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JUMP_HOST: ${{ vars.CLUSTER_JUMP_HOST }}
      GPU_HOST: ${{ vars.CLUSTER_GPU_HOST }}
      CLUSTER_USER: ${{ vars.CLUSTER_USER }}
      REMOTE_DIR: ${{ vars.CLUSTER_REMOTE_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure SSH jump host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config << EOF
          Host cluster-jump
              HostName $JUMP_HOST
              User $CLUSTER_USER
              ForwardAgent yes

          Host cluster-gpu
              HostName $GPU_HOST
              User $CLUSTER_USER
              ProxyJump cluster-jump
              ForwardAgent yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Add host keys
        run: |
          ssh-keyscan -H "$JUMP_HOST" "$GPU_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo to cluster
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            -e "ssh -F ~/.ssh/config" \
            ./ "cluster-gpu:$REMOTE_DIR/"

      - name: Submit training job (optional)
        if: ${{ vars.RUN_SBATCH == 'true' }}
        run: |
          ssh -F ~/.ssh/config cluster-jump \
            "cd \"$REMOTE_DIR\" && sbatch shell/train.sh"
